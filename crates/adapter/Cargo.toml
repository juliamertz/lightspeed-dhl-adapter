[package]
name = "adapter"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lightspeed-dhl-adapter"
path = "src/main.rs"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
overflow-checks = false

[profile.dev.package."*"]
opt-level = 3
debug = false

[dependencies]
dhl = { path = "../dhl" }
lightspeed = { path = "../lightspeed" }

clap = { workspace = true }
anyhow = "1.0.99"
thiserror = "2.0.12"
once_cell = "1.21.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "ansi"], default-features = false }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

serde = { version = "1", features = ["derive"] }
serde_with = "3"
serde_json = "1"
toml = "0.8"

tokio = { version = "1", features = ["full"] }                                                                                   
futures = "0.3"
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { workspace = true }

axum = "0.8"                                                                                                                        
axum-macros = "0.5"
axum-prometheus = "0.9"
metrics = "0.24"

diesel = { version = "2", features = ["chrono", "uuid", "serde_json"]}
diesel-async = { version = "0.9", features = [
    "postgres",
    "bb8",
    "async-connection-wrapper",
] }
http = "1"
scoped-futures = "0.1.4"


