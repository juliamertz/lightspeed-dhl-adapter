env: prod

dryRun: false
debug: false

gateway:
  className: envoy
  issuerName: letsencrypt-prod

configSecret:
  name: config
  key: config.toml

webhook:
  minReplicas: 3
  maxReplicas: 12 
  hostnames:
    - lightspeed-adapter.juliamertz.dev
    - nettenshop.juliamertz.dev
  probe:
    enabled: false
    proberUrl: blackbox-exporter.monitoring:9115
    interval: 60s
    module: http_2xx
    targetUrl: https://nettenshop.juliamertz.dev/ready

pollStatus:
  schedule: 0 6-18 * * 1-5
  jobHistoryLimit: 3

markStale:
  schedule: 0 2 * * *
  jobHistoryLimit: 3

clusterDB:
  replicas: 2
  storageSize: 10Gi
  storageClass: hcloud-volumes
  backup:
    enabled: false
    schedule: 0 0 0 * * *
    retentionPolicy: 90d

metrics:
  enabled: false
  releaseName: kube-prometheus-stack
