apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/part-of: {{ .Release.Name }}
  annotations:
    cert-manager.io/cluster-issuer: {{ default "letsencrypt-prod" .Values.gateway.issuerName }}
spec:
  gatewayClassName: {{ default "envoy" .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Release.Name }}-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
